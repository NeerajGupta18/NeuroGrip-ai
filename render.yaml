# Render Blueprint: one free web service that builds the Dockerfile and serves both the API
# and the dashboard from a single URL.
services:
  - type: web
    name: neurogrip-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass     # deploy a commit only after the CI tests pass
    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: ""
      # Optional. Paste a Postgres connection string to keep profiles across restarts;
      # leave blank and profiles live on the instance's disk and reset when it sleeps.
      - key: DATABASE_URL
        sync: false
      # Optional. Lets an LLM re-word the computed explanations.
      - key: GROQ_API_KEY
        sync: false
